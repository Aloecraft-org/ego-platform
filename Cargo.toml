[package]
name = "ego_platform"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "Cross-platform abstraction layer (logging, spawn, time, io, fs) for native, WASI P2, and browser targets"
license = "Apache-2.0"
repository = "https://github.com/aloecraft-org/ego-platform"

[lib]
name = "ego_platform"
path = "src/lib.rs"

[[bin]]
name = "ego-platform-example"
path = "src/main.rs"

[dependencies]
log = "0.4"

# --- Native only ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }

# --- WASM common (WASI and browser) ---
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }

# --- Not browser (native and WASI) ---
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
env_logger = "0.11" # picks up RUST_LOG from the environment (native or wasmtime)

# --- WASI P2 only ---
[target.'cfg(all(target_arch = "wasm32", target_env = "p2"))'.dependencies]
wasi = "0.14"

# --- Browser only ---
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Pinned: wasm-bindgen's ABI is unstable and must match the wasm-bindgen-cli /
# wasm-bindgen-test-runner version installed in the devcontainer and CI.
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }
web-time = "1.1"
web-sys = { version = "0.3", features = ["Window", "Storage", "console"] }
js-sys = "0.3"
futures = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
