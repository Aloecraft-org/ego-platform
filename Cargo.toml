[package]
name = "aloeplatform"
version = "0.1.0"
edition = "2024"

[lib]
name = "aloeplatform"
path = "src/lib.rs"

[[bin]]
name = "aloeplatform-example"
path = "src/main.rs"

[[test]]
name = "integration-tests"
path = "tests/integration.rs"

[[test]]
name = "io-integration-tests"
path = "tests/io_integration.rs"

[dependencies]
log = "0.4"
futures = "0.3"

# # Native only
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"

# # --- WASM Common (Both CLI and Browser) ---
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
futures = "0.3"

# # WASI P2 only
[target.'cfg(all(target_arch = "wasm32", target_env = "p2"))'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
wasi = "0.14"

# # Browser only
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
gloo-timers = { version = "0.3", features = ["futures"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }

[dev-dependencies]
# For testing async code
tokio-test = "0.4"

# Browser test dependencies
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"