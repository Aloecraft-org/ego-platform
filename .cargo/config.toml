[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
# runner = "trunk serve"

[target.wasm32-wasip2]
# Without a runner cargo tries to exec the .wasm directly and gets EACCES.
runner = ["wasmtime", "run", "--dir=.", "--"]
# FIXME: wasip2 is still considered unstable. Get rid of this as soon as there's an upgrade
rustflags = [
    "-C", "target-feature=+bulk-memory,+mutable-globals",
    "--cfg", "wasi_ext"
]

# No [build] target on purpose: bare cargo commands build for the host,
# which is what make *_native and the `ct` / `cr` aliases expect.
# Wasm targets are selected explicitly with --target (see Makefile).

# Profile optimizations
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Fast compile for development
[profile.dev]
opt-level = 0
debug = true
