# Cargo configuration for cross-platform builds
[target.wasm32-wasip2]
runner = [
    "wasmtime", "run",
    "-S", "inherit-network",
    "--dir", ".::.",           # ADD THIS - maps current directory
    "--dir", "/tmp::/tmp",
    "--env", "TMPDIR=/tmp",
    "--"
]

[target.wasm32-unknown-unknown]
runner = "trunk serve"

# FIXME: wasip2 is still considered unstable. Get rid of this as soon as there's an upgrade
rustflags = [
    "-C", "target-feature=+bulk-memory,+mutable-globals",
    "--cfg", "wasi_ext"
]

[development]
target = "wasm32-wasip2"

# Build settings
[build]
target = "wasm32-wasip2"
# Uncomment to set default target
# target = "wasm32-unknown-unknown"

# Profile optimizations
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Fast compile for development
[profile.dev]
opt-level = 0
debug = true
target = "wasm32-wasip2"