# Cargo configuration for cross-platform builds
[target.wasm32-wasip2]
runner = "wasmtime run -S inherit-network --env TMPDIR=/tmp --dir /tmp::/tmp"

[target.wasm32-unknown-unknown]
runner = "trunk serve"

# FIXME: wasip2 is still considered unstable. Get rid of this as soon as there's an upgrade
rustflags = [
    "-C", "target-feature=+bulk-memory,+mutable-globals",
    "--cfg", "wasi_ext"
]

# Build settings
[build]
# Uncomment to set default target
# target = "wasm32-unknown-unknown"

# Profile optimizations
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Fast compile for development
[profile.dev]
opt-level = 0
debug = true